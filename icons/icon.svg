<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1c1b12"/><stop offset="1" stop-color="#0e0d08"/>
      </linearGradient></defs>
      <rect width="512" height="512" fill="url(#g)"/>
      <!-- hi-vis top seam + stitch -->
      <rect x="0" y="0" width="512" height="16" fill="#B7CE24"/>
      <g stroke="#B7CE24" stroke-width="5" stroke-dasharray="12 12" opacity="0.32">
        <line x1="40" y1="36" x2="472" y2="36"/></g>
      <!-- four-bucket split, centered in safe zone -->
      <g>
        <rect x="128" y="286" width="54" height="118" rx="8" fill="#3E6B66"/>
        <rect x="196" y="238" width="54" height="166" rx="8" fill="#34445F"/>
        <rect x="264" y="182" width="54" height="222" rx="8" fill="#9FB61f"/>
        <rect x="332" y="126" width="54" height="278" rx="8" fill="#B7CE24"/>
      </g>
      <!-- coin markers on top of the two tall bars -->
      <circle cx="291" cy="182" r="15" fill="#0e0d08" stroke="#e7e2d4" stroke-width="6"/>
      <circle cx="359" cy="126" r="15" fill="#0e0d08" stroke="#e7e2d4" stroke-width="6"/>
      <!-- ledger baseline -->
      <rect x="112" y="408" width="288" height="10" rx="5" fill="#e7e2d4"/>
    </svg>